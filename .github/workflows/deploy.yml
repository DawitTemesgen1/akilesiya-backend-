name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      # We do NOT build or install here because cPanel handles npm install.
      # We upload the raw source code.
      
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /
          timeout: 90000 # Increased timeout to 90s
          security: loose # Allow self-signed certificates or loose SSL
          log-level: verbose # Provide more detail in case of failure
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
